{% if new_credential %}
<div class="credential-banner" id="credential-banner">
  <div class="credential-icon" aria-hidden="true">&#128273;</div>
  <div class="credential-body">
    <strong>New password for {{ new_credential.label }}</strong>
    <p>Copy this now. It is shown for this admin session only. Share it privately &mdash; there is no email sending.</p>
    <div class="credential-row">
      <code id="credential-password">{{ new_credential.password }}</code>
      <button type="button" class="btn btn-secondary btn-sm" data-copy-target="credential-password">Copy</button>
    </div>
  </div>
</div>
{% endif %}
